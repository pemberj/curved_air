[project]
name = "curved-air"
version = "0.1.0"
description = "Tools for optical design and optimisation"
readme = "README.md"
authors = [
    { name = "Jake Pember", email = "jake.pember@kuleuven.be" }
]
requires-python = ">=3.11"
dependencies = [
    "astropy>=7.0.0",
    "matplotlib>=3.9.2",
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "pyqt5>=5.15.11",
    "ref-index>=1.0",
    "scipy>=1.14.1",
]

[project.scripts]
curved-air = "curved_air:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
